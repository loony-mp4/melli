<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>for my girl :3</title>
<style>
  :root { --pink:#ffd9e8; --deep:#e98bb2; --cream:#fffafd; --ink:#a85e82; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; overflow:hidden; color:var(--ink);
    font-family:"Trebuchet MS", system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 20%, #fff 0 2px, transparent 3px),
      radial-gradient(circle at 80% 70%, #fff 0 2px, transparent 3px),
      linear-gradient(135deg,#ffe8f1,#ffd2e4 55%,#fff0f6);
    background-size:45px 45px, 61px 61px, auto;
  }
  body:before {
    content:""; position:fixed; inset:12px; border:3px dashed #fff;
    outline:2px solid rgba(255,255,255,.7); outline-offset:5px;
    border-radius:24px; pointer-events:none;
  }
  .lace {
    position:fixed; inset:0; pointer-events:none; opacity:.8;
    background:
      radial-gradient(circle, transparent 7px, white 7.8px, white 9px, transparent 9.8px) top left/24px 24px repeat-x,
      radial-gradient(circle, transparent 7px, white 7.8px, white 9px, transparent 9.8px) bottom left/24px 24px repeat-x;
    height:24px; z-index:5;
  }
  .lace.side { width:24px; height:100%; background:
      radial-gradient(circle, transparent 7px, white 7.8px, white 9px, transparent 9.8px) top left/24px 24px repeat-y; }
  .lace.right { left:auto; right:0; }
  main { min-height:100vh; display:grid; place-items:center; padding:48px 28px; position:relative; }
  .screen { display:none; width:min(760px,100%); text-align:center; animation:pop .55s ease both; position:relative; z-index:2; }
  .screen.active { display:block; }
  .screen.tap-next { cursor:pointer; }
  @keyframes pop { from { opacity:0; transform:translateY(14px) scale(.97) } to {opacity:1;transform:none} }
  .bow-button { border:0; background:none; cursor:pointer; filter:drop-shadow(0 8px 8px #d98aaa55); transition:transform .2s; padding:0; }
  .bow-button:hover { transform:rotate(-4deg) scale(1.04); }
  .bow-image { display:block; width:min( min(72vw,430px), 48vh); height:auto; object-fit:contain; margin:auto; }
  h1 { font-size:clamp(2rem,6vw,3.7rem); margin:12px 0 22px; color:#d875a1; }
  p { font-size:clamp(1.1rem,3vw,1.45rem); margin:8px 0 22px; }
  .photo-wrap { position:relative; display:inline-block; padding:12px; background:#fff; border:3px dotted #f2a8c7; border-radius:18px; box-shadow:0 12px 30px #b86e8c30; transform:rotate(-1.5deg); }
  .photo { display:block; width:min( min(64vw,390px), 65vh); height:min( min(64vw,390px), 65vh); object-fit:cover; border-radius:9px; background:#ffeaf2; }
  .caption { display:block; margin-top:10px; font-size:1rem; }
  .doodles { position:fixed; inset:0; pointer-events:none; z-index:1; color:#fff; font-size:clamp(22px,4vw,42px); }
  .doodles span { position:absolute; animation:float 4s ease-in-out infinite; text-shadow:0 2px 3px #d982a755; }
  .doodles span:nth-child(1){top:13%;left:8%}.doodles span:nth-child(2){top:20%;right:10%;animation-delay:.8s}
  .doodles span:nth-child(3){bottom:17%;left:11%;animation-delay:1.4s}.doodles span:nth-child(4){bottom:13%;right:9%;animation-delay:.4s}
  .doodles span:nth-child(5){top:48%;left:4%;animation-delay:1s}.doodles span:nth-child(6){top:55%;right:4%;animation-delay:1.8s}
  @keyframes float { 0%,100%{transform:translateY(0) rotate(-8deg)} 50%{transform:translateY(-13px) rotate(8deg)} }
  .arrow { position:absolute; font-size:2rem; color:#fff; text-shadow:0 2px 4px #c66d95; }
  .dance-img { display:block; width:min(70vw,430px); max-height:52vh; object-fit:contain; margin:0 auto; }
  @media(max-width:520px) {
  }
  @media(max-width:520px){ body:before{inset:8px} .photo{width:min(72vw,330px);height:min(72vw,330px)} }
</style>
</head>
<body>
<div class="lace"></div><div class="lace side"></div><div class="lace side right"></div>
<div class="doodles" aria-hidden="true">
  <span>♡</span><span>✧</span><span>૮₍ ˶ᵔ ᵕ ᵔ˶ ₎ა</span><span>୨୧</span><span>☆</span><span>♡</span>
</div>
<main>
  <section class="screen active" id="s0">
    <button class="bow-button" onclick="show(1)" aria-label="Open the bow">
      <img class="bow-image" src="assets/lace-bow.png" alt="pink lace bow">
    </button>
  </section>

  <section class="screen tap-next" id="s1" onclick="show(2)" title="click anywhere to continue">
    <h1>ani's property :3</h1>
    <span class="arrow" style="left:8%;top:35%">↘</span>
    <span class="arrow" style="right:8%;top:48%">♡</span>
    <div class="photo-wrap">
      <img class="photo" src="assets/girlfriend.jpg" alt="A photo of Ani">
    </div>
  </section>

  <section class="screen tap-next" id="s2" onclick="show(3)" title="click anywhere to continue">
    <div class="photo-wrap">
      <img class="photo" src="assets/dog.jpg" alt="A photo of the Yunskrrr">
      <span class="caption">the yunskrrr :p</span>
    </div>
  </section>

  <section class="screen tap-next" id="s3" onclick="show(0)" title="click anywhere to start again">
    <h1>ty for your time!</h1>
    <img class="dance-img" src="assets/dance.webp" alt="A silly little character dancing">
  </section>
</main>
<script>
  function show(n) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('s' + n).classList.add('active');
  }
</script>
</body>
</html>
